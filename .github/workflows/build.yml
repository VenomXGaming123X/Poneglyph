name: build-and-test
on: [push, pull_request, workflow_dispatch]
jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure + build x86 (engine, tools, tests)
        shell: pwsh
        run: |
          cmake -S . -B build\x86 -A Win32 *> cfg86.log
          $c1 = $LASTEXITCODE
          cmake --build build\x86 --config Release *> build86.log
          $c2 = $LASTEXITCODE
          Get-Content cfg86.log, build86.log | Select-String -CaseSensitive -Pattern ' error C\d+| error LNK\d+|CMake Error|fatal error' | Select-Object -First 12 | ForEach-Object { $t = $_.Line.Trim().Replace('%','%25'); if ($t.Length -gt 400) { $t = $t.Substring(0,400) }; Write-Host "::error title=x86-compile::$t" }
          if ($c1 -ne 0 -or $c2 -ne 0) { exit 1 }
      - name: Configure + build x64 (manager)
        shell: pwsh
        run: |
          cmake -S . -B build\x64 -A x64 *> cfg64.log
          $c1 = $LASTEXITCODE
          cmake --build build\x64 --config Release *> build64.log
          $c2 = $LASTEXITCODE
          Get-Content cfg64.log, build64.log | Select-String -CaseSensitive -Pattern ' error C\d+| error LNK\d+|CMake Error|fatal error' | Select-Object -First 12 | ForEach-Object { $t = $_.Line.Trim().Replace('%','%25'); if ($t.Length -gt 400) { $t = $t.Substring(0,400) }; Write-Host "::error title=x64-compile::$t" }
          if ($c1 -ne 0 -or $c2 -ne 0) { exit 1 }
      - name: Core tests + Windows proxy runtime tests
        shell: pwsh
        run: |
          ctest --test-dir build\x86 -C Release --output-on-failure *> test.log
          $c = $LASTEXITCODE
          Get-Content test.log | Select-String -Pattern 'FAIL|Failed|RESULT' | Select-Object -First 15 | ForEach-Object { $t = $_.Line.Trim().Replace('%','%25'); Write-Host "::error title=test::$t" }
          if ($c -ne 0) { exit 1 }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\Poneglyph\Engine | Out-Null
          Copy-Item build\x64\Source\PoneglyphManager\Release\Poneglyph.exe dist\Poneglyph\
          Copy-Item build\x86\Source\PoneglyphEngine\Release\d3d9.dll dist\Poneglyph\Engine\
          Copy-Item build\x86\Source\PoneglyphTools\Release\pg_tool.exe dist\Poneglyph\
          Copy-Item Documentation\Read_Me.txt,LICENSE dist\Poneglyph\
          Copy-Item -Recurse Source\PoneglyphSDK dist\Poneglyph\SDK
      - uses: actions/upload-artifact@v4
        with: { name: Poneglyph_v1.0.0_windows, path: dist }
